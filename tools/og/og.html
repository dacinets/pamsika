<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Sora;src:url(../../public/fonts/sora-latin.woff2) format('woff2');font-weight:100 800}
@font-face{font-family:Inter;src:url(../../public/fonts/inter-latin.woff2) format('woff2');font-weight:100 900}
*{margin:0;box-sizing:border-box}body{width:1200px;height:630px;overflow:hidden;background:#05080f;font-family:Inter;color:#fff;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(700px 500px at 95% -10%,rgba(0,90,189,.55),transparent 60%),radial-gradient(500px 360px at 0% 110%,rgba(255,122,0,.25),transparent 60%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:80px 80px}
.photo{position:absolute;right:48px;top:48px;bottom:48px;width:430px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:62% center}
.photo:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(5,8,15,.7))}
.copy{position:absolute;left:64px;top:64px;width:640px}
.logo{display:inline-block;background:#111827;padding:14px 18px;border-radius:4px}.logo img{height:44px;display:block}
.pill{display:inline-flex;align-items:center;gap:10px;margin-top:48px;padding:8px 14px;border:1px solid rgba(255,255,255,.16);border-radius:999px;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:#AEB7C6;font-weight:600}
.pill:before{content:'';width:8px;height:8px;border-radius:50%;background:#FF7A00;box-shadow:0 0 12px #FF7A00}
h1{font-family:Sora;font-weight:700;font-size:92px;line-height:.95;letter-spacing:-.04em;text-transform:uppercase;margin-top:24px}
.o{color:#FF7A00}.b{background:linear-gradient(100deg,#7fb6f0,#2f80d6 55%,#005ABD);-webkit-background-clip:text;color:transparent}
.glass{position:absolute;left:640px;bottom:84px;padding:18px 22px;border-radius:10px;background:linear-gradient(155deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(20px);font-size:15px;color:rgba(255,255,255,.85);letter-spacing:.14em;text-transform:uppercase;font-weight:600;line-height:1.9}
</style></head><body><div class="bg"></div><div class="grid"></div>
<div class="photo"><img src="../../public/media/founder-1280.webp"></div>
<div class="copy"><span class="logo"><img src="../../public/brand/pamsika-A-wordmark-reversed.svg"></span><div><span class="pill">African ambition. Amplified.</span></div><h1>Ideas that<br><span class="o">move</span> <span class="b">business.</span></h1></div>
<div class="glass">AdLab · Creative Market<br>Strategy · Creativity · Technology</div>
</body></html>
