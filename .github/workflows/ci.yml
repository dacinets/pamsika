name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring
      - run: npm ci
      - name: PHP syntax
        run: find public/api tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Upload deployable site
        uses: actions/upload-artifact@v4
        with:
          name: public_html
          path: out/
          include-hidden-files: true
